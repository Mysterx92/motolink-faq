name: MotoLink Play TEST v43 final-user donation popup wording
on:
  push:
    branches:
      - ci/motolink-playtest-user-copy-v43
    paths:
      - '.github/workflows/play-test-faq-build.yml'
      - 'ci/patch_play_test_apps_v39.py'
      - 'ci/patch_play_test_apps_v40.py'
      - 'ci/patch_play_test_donations_v41.py'
      - 'ci/patch_play_test_paypal_direct_v42.py'
      - 'ci/patch_play_test_user_copy_v43.py'
      - 'ci/fetch_play_icons_v39.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated build helper branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout MotoLink Play TEST sources (read-only)
        uses: actions/checkout@v4
        with:
          repository: Mysterx1992/MotoLink
          ref: play/v182-localized-ble-resync-test
          path: src
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply isolated FAQ and Privacy source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/patch_play_test_faq.py ci/patch_play_test_apps_v39.py ci/patch_play_test_apps_v40.py ci/patch_play_test_donations_v41.py ci/patch_play_test_paypal_direct_v42.py ci/patch_play_test_user_copy_v43.py ci/fetch_play_icons_v39.py
          python3 ci/patch_play_test_faq.py
          python3 ci/patch_play_test_apps_v39.py
          python3 ci/patch_play_test_apps_v40.py
          python3 ci/patch_play_test_donations_v41.py
          python3 ci/patch_play_test_paypal_direct_v42.py
          python3 ci/patch_play_test_user_copy_v43.py
      - name: Confirm patch scope and unchanged app package
        shell: bash
        run: |
          set -euo pipefail
          cd src
          git diff --name-only | sort > /tmp/motolink_changes.txt
          diff -u /dev/stdin /tmp/motolink_changes.txt <<'EOF'
          app/build.gradle.kts
          app/src/main/AndroidManifest.xml
          app/src/main/java/it/motolink/app/MainActivity.kt
          app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          EOF
          grep -Fq 'applicationIdSuffix = ".preplaytest2"' app/build.gradle.kts
          grep -Fq 'versionCode = 43' app/build.gradle.kts
          grep -Fq 'Grazie per far parte di questa avventura!' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'Grazie per aver scelto MotoLink!' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'FF47AQ6KB4QFC' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'openStickerRequestEmail()' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'stickerMailBody()' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'v41_support_prompt_once' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'showPayPalReturnUnverified()' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'https://www.paypal.com/ncp/payment/FF47AQ6KB4QFC' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'motolink-test' app/src/main/AndroidManifest.xml
          grep -Fq 'fun donationInviteTitle()' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'DonationReturnActivity' app/src/main/java/it/motolink/app/DonationReturnActivity.kt
          grep -Fq 'Page.APPS' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -Fq 'fun navigateSystemBack()' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -Fq 'appCatalogDescription(app.packageId)' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -Fq 'fun appCatalogDescription(packageName: String)' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'onBackInvokedDispatcher.registerOnBackInvokedCallback(' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'enableOnBackInvokedCallback="true"' app/src/main/AndroidManifest.xml
          grep -Fq 'fun appCatalogGuideBody(categories: Boolean)' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'https://mysterx92.github.io/motolink-faq/' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'https://mysterx92.github.io/motolink-privacy/' app/src/main/java/it/motolink/app/MainActivity.kt
          grep -Fq 'GuideTarget(594f, 198f, 247f, 78f)' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -Fq 'guideHelpBody(false)' app/src/main/java/it/motolink/app/TrofeoDashboardView.kt
          grep -Fq 'fun guideHelpTitle(faq: Boolean)' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
          grep -Fq 'fun guideHelpBody(faq: Boolean)' app/src/main/java/it/motolink/app/MotoLinkLocale.kt
      - name: Collect official Play app icons (with diagnostic fallback)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 ci/fetch_play_icons_v39.py
          test "$(find src/app/src/main/res/drawable-nodpi -name 'app_catalog_*.png' | wc -l)" -eq 12
      - name: Compile standalone Play TEST APK from source
        shell: bash
        run: |
          set -euo pipefail
          cd src
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify installation metadata and Android signatures
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > TEST_APKSIGNER.txt
          "$BT/aapt" dump badging "$APK" > TEST_BADGING.txt
          grep -Fq "package: name='it.motolink.app.preplaytest2'" TEST_BADGING.txt
          grep -Fq "versionCode='43'" TEST_BADGING.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > TEST_ZIPALIGN.txt
          sha256sum "$APK" > TEST_SHA256.txt
      - name: Upload test APK and checks (no private keys)
        uses: actions/upload-artifact@v4
        with:
          name: MotoLink_V1_8_2_User_Facing_Support_Copy_Play_TEST_APK_v43
          path: |
            src/app/build/outputs/apk/debug/app-debug.apk
            TEST_APKSIGNER.txt
            TEST_BADGING.txt
            TEST_ZIPALIGN.txt
            TEST_SHA256.txt
            PLAY_ICON_AUDIT.json
          if-no-files-found: error
          retention-days: 14
